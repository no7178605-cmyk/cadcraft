name: Windows installer (Hebrew)

# Builds the Windows x64 installer (MSI) and portable zip of this fork's `hebrew` branch and
# publishes them as a GitHub release. Unsigned: no signing secrets live in this fork, so
# package.ps1 skips signing and Windows SmartScreen asks once before the first install.

on:
  push:
    branches: [hebrew]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-hebrew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: WiX v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-hebrew-${{ hashFiles('Cargo.lock') }}

      - name: Build and package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64-hebrew
          path: dist/release/*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hebrew-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CADCraft בעברית ($tag)" \
            --notes "Windows x64 installer of the hebrew branch. Unsigned: on first install choose More info → Run anyway."
